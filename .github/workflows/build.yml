name: Build AutoMiner Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes de logica (PC)
        run: sh tests/run.sh

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Configure
        run: >-
          xmake f -y -p android -a arm64-v8a -m release
          --ndk=${{ steps.ndk.outputs.ndk-path }} --ndk_sdkver=28

      - name: Build
        run: xmake -y AutoMiner

      - name: Package
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          mkdir -p dist
          cp build/android/arm64-v8a/release/AutoMiner.levipack "dist/AutoMiner-${VERSION}.levipack"
          cp build/android/arm64-v8a/release/AutoMiner.so "dist/AutoMiner-${VERSION}.so"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoMiner-Android
          path: |
            dist/AutoMiner-*.levipack
            dist/AutoMiner-*.so
          if-no-files-found: error
